<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ri_greifen – ri_Satellitenbildechtzeitaufnahme</title>
<style>
:root{--bg:#f4f3ef;--fg:#1c1c1a;--mu:#6b6a64;--bd:#d6d4cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--fg:#ecebe6;--mu:#9a988f;--bd:#3a3935;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--fg:#ecebe6;--mu:#9a988f;--bd:#3a3935;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,sans-serif}
h1{font-size:17px;margin:0 0 2px}
p{margin:2px 0 10px;color:var(--mu);font-size:13px}
canvas{display:block;width:100%;max-width:520px;margin:0 auto;border-radius:10px;background:#0b0d10}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
button{font:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--fg)}
button.on{background:var(--fg);color:var(--bg)}
#st{text-align:center;font-size:13px;color:var(--mu);min-height:20px}
#ly{display:flex;max-width:520px;margin:10px auto 0;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--bd)}
#ly div{flex:1}
.cap{text-align:center;font-size:12px;color:var(--mu);margin-top:4px}
</style></head><body>
<h1>ri_greifen</h1>
<p>Theoretische ri_Satellitenbildechtzeitaufnahme: Kreisareal in vier Bögen Ro Ra Ri Re, überkreuzte Tentacleconfiguration greift aus der Ferne, der Inhalt wird ri_langgestreckt und entgegengesetzt wieder ri_langgestreckt.</p>
<div class="row" id="pl"></div>
<canvas id="c" width="520" height="520"></canvas>
<div id="st"></div>
<div id="ly"></div>
<div class="cap">16 ri_Ebenen: Ro Ra Ri Re Ro Ra Ri Re (je zwei Farben)</div>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=520,CX=260,CY=320,R=150,T=7;
var places={ 'New York':{s:11,d:1.0,g:0.15,b:'#3b4350'}, 'Salzgitter':{s:23,d:0.55,g:0.6,b:'#46513a'}, 'Berlin':{s:5,d:0.8,g:0.4,b:'#434a44'} };
var names=['Ro','Ra','Ri','Re'];
var pairs=[['#d62828','#111111'],['#111111','#ffffff'],['#ffffff','#f2c600'],['#ffffff','#2a9d4a']];
var cols=['#d62828','#111111','#111111','#ffffff','#ffffff','#f2c600','#ffffff','#2a9d4a','#7b2cbf','#d62828','#111111','#ffffff','#ffffff','#1f5fd6','#ffffff','#2a9d4a'];
var ly=document.getElementById('ly');
cols.forEach(function(c){var d=document.createElement('div');d.style.background=c;ly.appendChild(d)});
var map=document.createElement('canvas');map.width=W;map.height=W;
function rnd(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(p){
  var m=map.getContext('2d'),r=rnd(p.s);
  m.fillStyle=p.b;m.fillRect(0,0,W,W);
  for(var i=0;i<14;i++){m.fillStyle='rgba(60,140,70,'+(0.25+p.g*0.5)+')';m.beginPath();m.arc(r()*W,r()*W,20+r()*60*p.g+10,0,7);m.fill()}
  m.strokeStyle='#2c6fa8';m.lineWidth=16;m.beginPath();m.moveTo(0,200+r()*200);
  m.bezierCurveTo(150,r()*W,330,r()*W,W,150+r()*250);m.stroke();
  var g=Math.round(26/p.d);
  m.strokeStyle='rgba(20,20,20,.7)';m.lineWidth=3;
  for(var x=0;x<W;x+=g){m.beginPath();m.moveTo(x+r()*4,0);m.lineTo(x+r()*4,W);m.stroke()}
  for(var y=0;y<W;y+=g){m.beginPath();m.moveTo(0,y+r()*4);m.lineTo(W,y+r()*4);m.stroke()}
  for(var k=0;k<260*p.d;k++){var s=6+r()*10,v=90+r()*110|0;m.fillStyle='rgb('+v+','+v+','+(v+8)+')';m.fillRect(r()*W,r()*W,s,s*(0.6+r()*0.8))}
}
var cur='New York';
var pl=document.getElementById('pl');
Object.keys(places).forEach(function(n){var b=document.createElement('button');b.textContent=n;b.onclick=function(){cur=n;gen(places[n]);[].forEach.call(pl.children,function(x){x.className=x.textContent===n?'on':''})};if(n===cur)b.className='on';pl.appendChild(b)});
gen(places[cur]);
function sector(s,a,b){ctx.beginPath();ctx.moveTo(CX,CY);ctx.arc(CX,CY,R,a,b);ctx.closePath()}
function ang(s){return [Math.PI,1.5*Math.PI,0,0.5*Math.PI][s]}
function mid(s){return ang(s)+Math.PI/4}
var sats=[60,160,260,360,460],sl=['Ro','Ra','Ri','Re','Ro'];
function tentacle(si,s,reach,col,time){
  var m=mid(s),tx=CX+0.62*R*Math.cos(m),ty=CY+0.62*R*Math.sin(m);
  var sx=sats[si],sy=64,cx=(sx+tx)/2+Math.sin(time*2+si)*34,cy=170;
  ctx.strokeStyle=col;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();
  var n=40,ex=sx,ey=sy;
  for(var i=0;i<=n*reach;i++){var t=i/n,u=1-t;ex=u*u*sx+2*u*t*cx+t*t*tx;ey=u*u*sy+2*u*t*cy+t*t*ty;if(i)ctx.lineTo(ex,ey);else ctx.moveTo(ex,ey)}
  ctx.stroke();ctx.fillStyle=col;ctx.beginPath();ctx.arc(ex,ey,5,0,7);ctx.fill();
}
function stretch(s,k,tang,inv){
  ctx.save();sector(s,ang(s),ang(s)+Math.PI/2);ctx.clip();
  var m=mid(s)+(tang?Math.PI/2:0);
  ctx.translate(CX,CY);ctx.rotate(m);ctx.scale(1+k,1/(1+k*0.35));ctx.rotate(-m);ctx.translate(-CX,-CY);
  ctx.drawImage(map,0,0);ctx.restore();
  if(inv){ctx.save();sector(s,ang(s),ang(s)+Math.PI/2);ctx.clip();ctx.globalCompositeOperation='difference';ctx.fillStyle='#fff';ctx.fillRect(0,0,W,W);ctx.restore()}
}
var st=document.getElementById('st');
function frame(){
  var time=performance.now()/1000,ph=(time/T)%4,i=Math.floor(ph)%4,p=ph-Math.floor(ph),j=(i+2)%4;
  ctx.fillStyle='#0b0d10';ctx.fillRect(0,0,W,W);
  ctx.globalAlpha=0.55;ctx.drawImage(map,0,0);ctx.globalAlpha=1;
  ctx.save();ctx.beginPath();ctx.arc(CX,CY,R,0,7);ctx.clip();ctx.drawImage(map,0,0);ctx.restore();
  var reach=Math.min(1,p/0.25),A=0,B=0;
  if(p>=0.25&&p<0.6){A=(p-0.25)/0.35*1.1}else if(p>=0.6){A=1.1*(1-(p-0.6)/0.4)}
  var inv=p>=0.6;
  var ks=[i,j];
  stretch(i,A,inv,inv);stretch(j,A,!inv,inv);
  for(var s=0;s<4;s++){
    var g=ctx.createLinearGradient(CX-R,CY-R,CX+R,CY+R);g.addColorStop(0,pairs[s][0]);g.addColorStop(1,pairs[s][1]);
    ctx.save();sector(s,ang(s),ang(s)+Math.PI/2);ctx.globalAlpha=(s===i||s===j)?0.4:0.22;ctx.fillStyle=g;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;ctx.stroke();ctx.restore();
    var m=mid(s);ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillText(names[s],CX+0.82*R*Math.cos(m),CY+0.82*R*Math.sin(m)+6);
  }
  ctx.font='12px system-ui';
  sats.forEach(function(x,k){ctx.fillStyle='#ddd';ctx.fillRect(x-9,56,18,10);ctx.fillRect(x-20,59,9,4);ctx.fillRect(x+11,59,9,4);ctx.fillText('ri_Satellit '+sl[k],x,46)});
  [i,j].forEach(function(s){
    var m=mid(s),tx=CX+0.62*R*Math.cos(m),k=0,best=1e9;
    sats.forEach(function(x,q){var d=Math.abs(x-(W-tx));if(d<best){best=d;k=q}});
    tentacle(k,s,reach,pairs[s][0]==='#111111'?'#ffffff':pairs[s][0],time);
  });
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillText('ri_Luftraum (mittlere ri_Höhe)',W/2,175);
  ctx.textAlign='left';ctx.fillStyle='#9ad';ctx.fillText(cur+' · ri_Echtzeit '+new Date().toLocaleTimeString('de-DE'),10,508);
  st.textContent='ri_greifen '+names[i]+' + '+names[j]+' (überkreuzt) – '+(p<0.25?'Tentacle greift':p<0.6?'ri_langgestreckt':'entgegengesetzt ri_langgestreckt');
  requestAnimationFrame(frame);
}
frame();
})();
</script></body></html>
