<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1100" width="600" height="1100" font-family="'Comic Sans MS','Segoe Print',cursive" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="600" height="1100" fill="#fff"/>

  <!-- Quaderstruktur mit vier Tentakeln (blau) -->
  <g fill="none" stroke="#2a2ae0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 70 L140 60 L200 75 L130 88 Z"/>
    <path d="M70 70 L72 150 L130 165 L130 88"/>
    <path d="M130 165 L200 150 L200 75"/>
    <path d="M82 160 Q78 200 86 240"/>
    <path d="M100 163 Q96 205 104 250"/>
    <path d="M122 166 Q120 210 126 245"/>
    <path d="M178 156 Q184 200 176 235"/>
  </g>
  <!-- Wellen -->
  <g fill="none" stroke="#222" stroke-width="2" stroke-linecap="round">
    <path d="M40 262 Q70 280 105 262"/>
    <path d="M52 274 Q80 290 112 274"/>
  </g>

  <!-- Ra-Text -->
  <text x="230" y="60" fill="#ff2bd6" font-size="30">Ra</text>
  <text x="230" y="90" fill="#444" font-size="18">if you</text>
  <text x="230" y="112" fill="#444" font-size="18">are using</text>
  <text x="230" y="134" fill="#444" font-size="18">these</text>
  <text x="230" y="158" fill="#444" font-size="18">Ri("Jail")</text>
  <path d="M212 118 L228 150 M228 118 L212 150" stroke="#e00" stroke-width="3"/>

  <!-- Richter / Beobachter -->
  <path d="M140 262 Q210 235 270 255" fill="none" stroke="#e00" stroke-width="2.5"/>
  <text x="150" y="290" fill="#e00" font-size="20">Ro("Richter")</text>
  <text x="150" y="322" fill="#222" font-size="20">o(<tspan fill="#f5d000">X</tspan>)==Re</text>

  <!-- Hinweis -->
  <text x="40" y="380" fill="#111" font-size="17">Ri("Das ist kein Pfeil, Zeiger, eine Richtung etcRe")</text>
  <path d="M40 410 L160 398" stroke="#f5d000" stroke-width="5" stroke-linecap="round"/>
  <text x="230" y="425" fill="#ff2bd6" font-size="44" font-weight="bold">Ro</text>
  <path d="M390 420 L440 395" stroke="#2a2ae0" stroke-width="5" stroke-linecap="round"/>

  <!-- Optionszeilen mit "<+" -->
  <g font-size="18" fill="#222">
    <text x="40" y="480">Musik hinzufügen</text>
    <text x="40" y="530">Personen markieren</text>
    <text x="40" y="580">Ort hinzufügen  <tspan font-size="24" fill="#000">rt. replikant</tspan></text>
    <text x="40" y="630">Nur im Profil posten</text>
    <text x="40" y="680">Zielgruppe</text>
    <text x="40" y="730">Außerdem teilen in …</text>
    <text x="40" y="780">Weitere Optionen</text>
  </g>
  <g stroke-width="4" stroke-linecap="round" fill="none">
    <g id="pf"><path d="M520 468 L500 480 L520 492" stroke="#ff2bd6"/><path d="M522 468 L506 494" stroke="#2a2ae0"/></g>
    <use href="#pf" y="50"/>
    <use href="#pf" y="100"/>
    <use href="#pf" y="150"/>
    <use href="#pf" y="200"/>
    <use href="#pf" y="250"/>
    <use href="#pf" y="300"/>
  </g>
  <path d="M38 566 L56 590 M56 566 L38 590" stroke="#e00" stroke-width="4"/>

  <!-- ReReRe -->
  <text x="40" y="940" fill="#00e000" font-size="150" font-weight="bold" textLength="520" lengthAdjust="spacingAndGlyphs" opacity="0.9">ReReRe</text>

  <!-- Ro durchgestrichen + (ri_teilen) -->
  <text x="300" y="1010" fill="#111" font-size="34">Ro</text>
  <path d="M296 980 L345 1015" stroke="#e00" stroke-width="4"/>
  <text x="360" y="1010" fill="#111" font-size="26">(ri_teilen)</text>

  <!-- Teilen-Button -->
  <rect x="40" y="1040" width="520" height="40" rx="10" fill="#4f5bf0"/><text x="300" y="1067" text-anchor="middle" fill="#fff" font-size="16">Teilen</text><text x="60" y="1070" fill="#f5d000" font-size="30">Ri</text><text x="500" y="1070" fill="#f5d000" font-size="30">Ri</text>
</svg>
