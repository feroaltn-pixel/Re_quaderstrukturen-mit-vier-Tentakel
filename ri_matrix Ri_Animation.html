<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ri_matrix Ri_Animation</title>
<style>
:root{--bg:#000;--fg:#eee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
#g{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:100%;gap:2px}
.q{position:relative;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.q{cursor:pointer}.q.f{grid-column:1/3;grid-row:1/3}#g.s .q:not(.f){display:none}.l{position:absolute;left:10px;top:8px;font-weight:700;font-size:22px;letter-spacing:1px}
</style></head><body>
<div id="g">
<div class="q"><canvas data-c="#ff2a2a" data-a="0"></canvas><span class="l" style="color:#ff2a2a">Ro</span></div>
<div class="q"><canvas data-c="#ffd400" data-a="180"></canvas><span class="l" style="color:#ffd400">Ra</span></div>
<div class="q"><canvas data-c="#3da5ff" data-a="90"></canvas><span class="l" style="color:#3da5ff">Ri</span></div>
<div class="q"><canvas data-c="#b46cff" data-a="270"></canvas><span class="l" style="color:#b46cff">Re</span></div>
</div>
<script>
const chars="אבגדהוזחטיכלמנסעפצקרשת0123456789ro ra ri re".replace(/ /g,"").split("");
const words=["Ro","Ra","Ri","Re"];
document.querySelectorAll("canvas").forEach(cv=>{
  const ctx=cv.getContext("2d"),col=cv.dataset.c,ang=cv.dataset.a*Math.PI/180,fs=16;
  let W,H,LW,LH,drops;
  function size(){
    const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
    cv.width=r.width*d;cv.height=r.height*d;W=cv.width;H=cv.height;
    const s=(cv.dataset.a%180)?1:0;LW=s?H:W;LH=s?W:H;
    drops=Array(Math.ceil(LW/(fs*d))).fill(0).map(()=>Math.random()*-50);
  }
  size();addEventListener("resize",size);
  function draw(){
    const d=window.devicePixelRatio||1;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle="rgba(0,0,0,.08)";ctx.fillRect(0,0,W,H);
    ctx.translate(W/2,H/2);ctx.rotate(ang);ctx.translate(-LW/2,-LH/2);
    ctx.font=(fs*d)+"px monospace";
    drops.forEach((y,i)=>{
      const t=Math.random()<.04?words[Math.floor(Math.random()*4)]:chars[Math.floor(Math.random()*chars.length)];
      ctx.fillStyle="#fff";ctx.fillText(t,i*fs*d,y*fs*d);
      ctx.fillStyle=col;ctx.fillText(t,i*fs*d,(y-1)*fs*d);
      drops[i]=(y*fs*d>LH&&Math.random()>.975)?0:y+1;
    });
  }
  setInterval(draw,50);
});
document.querySelectorAll('.q').forEach(q=>q.addEventListener('click',()=>{const g=document.getElementById('g'),on=q.classList.toggle('f');g.classList.toggle('s',on);setTimeout(()=>dispatchEvent(new Event('resize')),50)}));
</script></body></html>
