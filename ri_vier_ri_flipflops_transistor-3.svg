<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- NMOS: Gate links, Drain oben (30,-20), Source unten (30,20) -->
    <g id="nmos" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
      <path d="M0 0H10M10 -10V10M14 -10V10M14 -8H30V-20M14 8H30V20"/>
    </g>
    <!-- PMOS: wie NMOS, aber mit Blase am Gate -->
    <g id="pmos" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
      <path d="M0 0H4M10 -10V10M14 -10V10M14 -8H30V-20M14 8H30V20"/>
      <circle cx="7" cy="0" r="3"/>
    </g>

    <!-- CMOS-NOR-Gatter: 2 PMOS in Reihe (oben), 2 NMOS parallel (unten) -->
    <g id="nor" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
      <use href="#pmos" x="70" y="50"/>
      <use href="#pmos" transform="translate(130,110) scale(-1,1)"/>
      <use href="#nmos" x="40" y="190"/>
      <use href="#nmos" transform="translate(160,190) scale(-1,1)"/>
      <path d="M80 10H120M100 10V30M100 70V90M100 130V150M70 150H130M70 150V170M130 150V170M70 210V230M130 210V230M60 230H140M130 150H190"/>
      <path d="M0 50H70M20 50V190H40M170 110H130M150 110V190H160"/>
      <g fill="currentColor" stroke="none">
        <circle cx="20" cy="50" r="3.5"/>
        <circle cx="150" cy="110" r="3.5"/>
        <circle cx="100" cy="150" r="3.5"/>
        <circle cx="130" cy="150" r="3.5"/>
      </g>
    </g>

    <!-- SR-Flipflop: zwei NOR-Gatter, über Kreuz rückgekoppelt -->
    <g id="ff" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
      <rect x="-10" y="-20" width="480" height="270" rx="10" fill="#14141a" stroke-width="1.5"/>
      <use href="#nor"/>
      <use href="#nor" transform="translate(460,0) scale(-1,1)"/>
      <!-- Rückkopplung: Q -> Eingang von NOR 2, /Q -> Eingang von NOR 1 -->
      <path d="M190 150H210V110H290"/>
      <path d="M270 150H250V130H190V110H170"/>
      <g fill="currentColor" stroke="none">
        <circle cx="210" cy="150" r="3.5"/>
        <circle cx="250" cy="150" r="3.5"/>
        <g font-family="monospace" font-size="10" text-anchor="middle">
          <text x="100" y="4">VDD</text>
          <text x="360" y="4">VDD</text>
          <text x="100" y="244">GND</text>
          <text x="360" y="244">GND</text>
        </g>
        <g font-family="monospace" font-size="14">
          <text x="6" y="43">R</text>
          <text x="454" y="43" text-anchor="end">S</text>
        </g>
      </g>
    </g>
  </defs>

  <rect width="1200" height="880" fill="#0e0e12"/>

  <!-- Verbindungen: Q -> S im Uhrzeigersinn (weiß), /Q -> R gegen den Uhrzeigersinn (blau) -->
  <g fill="none" stroke-width="2.5" stroke-linejoin="round">
    <g stroke="#ffffff">
      <polyline points="310,250 310,380 1130,380 1130,150 1100,150"/>
      <polyline points="850,250 850,400 1160,400 1160,570 1100,570"/>
      <polyline points="850,630 850,470 600,470 600,570 560,570"/>
      <polyline points="310,630 310,455 580,455 580,150 560,150"/>
    </g>
    <g stroke="#8ec5ff">
      <polyline points="350,250 350,440 60,440 60,570 100,570"/>
      <polyline points="890,250 890,420 70,420 70,150 100,150"/>
      <polyline points="350,670 350,810 620,810 620,570 640,570"/>
      <polyline points="890,670 890,830 610,830 610,150 640,150"/>
    </g>
  </g>

  <!-- Flipflops: oben links Ro, oben rechts Ra, unten links Re, unten rechts Ri -->
  <use href="#ff" x="100" y="100" color="#ff4d4d"/>
  <use href="#ff" x="640" y="100" color="#ffffff"/>
  <use href="#ff" x="100" y="520" color="#7ee08a"/>
  <use href="#ff" x="640" y="520" color="#f5e663"/>

  <!-- Abzweigpunkte der unteren Zellen -->
  <g fill="#f5e663">
    <circle cx="310" cy="630" r="3.5"/>
    <circle cx="850" cy="630" r="3.5"/>
  </g>

  <g font-family="monospace" font-size="14">
    <text x="108" y="72" fill="#ff4d4d">Ro · SR-Flipflop (oben links)</text>
    <text x="648" y="72" fill="#ffffff">Ra · SR-Flipflop (oben rechts)</text>
    <text x="108" y="492" fill="#7ee08a">Re · SR-Flipflop (unten links)</text>
    <text x="648" y="492" fill="#f5e663">Ri · SR-Flipflop (unten rechts)</text>
  </g>

  <text x="600" y="866" font-family="monospace" font-size="15" fill="#9a9aa8" text-anchor="middle">weiß: Q → S (im Uhrzeigersinn) · blau: /Q → R (gegen den Uhrzeigersinn) · ri_vier_ri_flipflops</text>
</svg>
