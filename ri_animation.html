<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ri_Animation</title>
<style>
  :root{
    --bg:#0d0f14;
    --ro:#d4263a;
    --ra:#f4f4f0;
    --ri:#f2d22e;
    --re:#3cb371;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#e8e8e4;
    font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif}
  body{display:flex;flex-direction:column}
  header{padding:14px 18px 0}
  header h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.01em}
  header p{margin:2px 0 0;font-size:13px;color:#9aa0b4}
  canvas{flex:1;width:100%;min-height:0;display:block}
  footer{display:flex;align-items:center;gap:12px;padding:12px 18px 16px}
  .chip{width:34px;height:20px;border-radius:4px;border:1px solid #3a4056;flex:none}
  #label{flex:1;font-size:14px;line-height:1.35}
  button{flex:none;font:inherit;font-size:14px;color:#e8e8e4;background:#1b1f2c;
    border:1px solid #3a4056;border-radius:6px;padding:8px 14px;cursor:pointer}
  button:hover{background:#252a3a}
  button:focus-visible{outline:2px solid var(--ri);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1>Ri_Animation</h1>
  <p>Re_Präsident (erfundene Figur) und Re_Quaderstruktur mit vier Tentakeln</p>
</header>
<canvas id="c" aria-label="Animation: Eine Figur im Anzug läuft hin und her, über ihr schwebt eine Quaderstruktur mit vier Tentakeln, einer davon steckt in der Figur fest"></canvas>
<footer>
  <div class="chip" id="chip"></div>
  <div id="label"></div>
  <button id="toggle" type="button">Pause</button>
</footer>

<script>
(function(){
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const chip = document.getElementById('chip');
  const label = document.getElementById('label');
  const btn = document.getElementById('toggle');

  const W = 900, H = 560, GROUND = 480, LOOP = 18;
  const PH = [
    {n:'ro', c:'#d4263a', c2:'#000000', t:'Ro: Zustandsübergang. Die Tentakeln bewegen sich frei.'},
    {n:'ra', c:'#f4f4f0', c2:'#000000', t:'Ra: Transformation. Ein Tentakel greift nach der Figur.'},
    {n:'ri', c:'#f2d22e', c2:'#f4f4f0', t:'Ri: Verbindung. Der Tentakel steckt in der Figur fest.'},
    {n:'re', c:'#3cb371', c2:'#f4f4f0', t:'Re: Umgebung. Die Figur läuft weiter, der Tentakel bleibt.'}
  ];

  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = reduce ? 10 : 0;
  let playing = !reduce;
  let last = performance.now();
  btn.textContent = playing ? 'Pause' : 'Start';

  btn.addEventListener('click', () => {
    playing = !playing;
    btn.textContent = playing ? 'Pause' : 'Start';
    last = performance.now();
  });

  // stars (deterministic)
  const stars = [];
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) stars.push([rnd()*W, rnd()*GROUND*0.8, rnd()*1.3+0.3]);

  function resize(){
    const dpr = window.devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.floor(r.width * dpr));
    cv.height = Math.max(1, Math.floor(r.height * dpr));
    draw();
  }
  window.addEventListener('resize', resize);

  const clamp = (x,a,b) => Math.min(b, Math.max(a, x));
  const ease = x => { x = clamp(x,0,1); return x*x*(3-2*x); };
  const lerp = (a,b,k) => a + (b-a)*k;

  function phaseInfo(tm){
    let idx = tm < 4 ? 0 : tm < 8 ? 1 : tm < 13 ? 2 : 3;
    let r;
    if (tm < 4) r = 0;
    else if (tm < 8) r = ease((tm-4)/3);
    else if (tm < 17) r = 1;
    else r = 1 - ease(tm-17);
    return {idx, r};
  }

  function hexToRgb(h){
    return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  }
  function mixColor(a,b,k){
    const A = hexToRgb(a), B = hexToRgb(b);
    return 'rgb(' + A.map((v,i)=>Math.round(lerp(v,B[i],k))).join(',') + ')';
  }

  function bezier(p0,p1,p2,u){
    const a = 1-u;
    return [a*a*p0[0]+2*a*u*p1[0]+u*u*p2[0], a*a*p0[1]+2*a*u*p1[1]+u*u*p2[1]];
  }

  function tentacle(ax, ay, tx, ty, i, time, wob, color){
    const mid = [(ax+tx)/2 + (i%2 ? 30 : -30), (ay+ty)/2 + 40];
    const N = 26;
    let prev = [ax, ay];
    ctx.lineCap = 'round';
    for (let k = 1; k <= N; k++){
      const u = k/N;
      let p = bezier([ax,ay], mid, [tx,ty], u);
      // perpendicular wobble
      const dx = tx-ax, dy = ty-ay, len = Math.hypot(dx,dy) || 1;
      const nx = -dy/len, ny = dx/len;
      const w = Math.sin(u*7 - time*2.2 + i*1.3) * 11 * wob * Math.sin(u*Math.PI);
      p = [p[0] + nx*w, p[1] + ny*w];
      ctx.strokeStyle = color;
      ctx.lineWidth = lerp(8, 1.8, u);
      ctx.beginPath();
      ctx.moveTo(prev[0], prev[1]);
      ctx.lineTo(p[0], p[1]);
      ctx.stroke();
      prev = p;
    }
    return prev;
  }

  function figure(fx, dir, walk){
    ctx.save();
    ctx.translate(fx, GROUND);
    ctx.scale(dir, 1);
    const fill = '#1c2030', edge = '#4a5270';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // legs
    ctx.strokeStyle = fill; ctx.lineWidth = 10;
    for (const sgn of [1,-1]){
      const fxo = Math.sin(walk*sgn) * 22;
      const lift = Math.max(0, Math.cos(walk*sgn)) * 7;
      ctx.beginPath();
      ctx.moveTo(sgn*4, -70);
      ctx.lineTo(fxo, -lift);
      ctx.stroke();
    }
    // back arm
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(-18, -132);
    ctx.lineTo(-18 + Math.sin(walk)*14, -80);
    ctx.stroke();

    // torso (suit)
    ctx.fillStyle = fill; ctx.strokeStyle = edge; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-21,-136); ctx.lineTo(21,-136); ctx.lineTo(15,-68); ctx.lineTo(-15,-68);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // shirt wedge
    ctx.fillStyle = '#d9dbe3';
    ctx.beginPath();
    ctx.moveTo(-5,-136); ctx.lineTo(5,-136); ctx.lineTo(0,-108); ctx.closePath(); ctx.fill();
    // head (faceless)
    ctx.fillStyle = fill; ctx.strokeStyle = edge; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0,-153,13,0,Math.PI*2); ctx.fill(); ctx.stroke();
    // front arm
    ctx.strokeStyle = fill; ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(18, -132);
    ctx.lineTo(18 + Math.sin(-walk)*14, -80);
    ctx.stroke();
    ctx.restore();
  }

  function box(bx, by, color){
    const fill = '#1b1f2c';
    ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.fillStyle = fill; ctx.lineJoin = 'round';
    // side
    ctx.beginPath();
    ctx.moveTo(bx+45,by-30); ctx.lineTo(bx+67,by-46); ctx.lineTo(bx+67,by+14); ctx.lineTo(bx+45,by+30); ctx.closePath();
    ctx.fill(); ctx.stroke();
    // top
    ctx.beginPath();
    ctx.moveTo(bx-45,by-30); ctx.lineTo(bx-23,by-46); ctx.lineTo(bx+67,by-46); ctx.lineTo(bx+45,by-30); ctx.closePath();
    ctx.fill(); ctx.stroke();
    // front
    ctx.beginPath();
    ctx.rect(bx-45, by-30, 90, 60);
    ctx.fill(); ctx.stroke();
    // four small corner marks
    ctx.fillStyle = color;
    for (const [cx,cy] of [[bx-45,by+30],[bx+45,by+30],[bx-23,by+14],[bx+67,by+14]]){
      ctx.beginPath(); ctx.arc(cx,cy,3,0,Math.PI*2); ctx.fill();
    }
  }

  function draw(){
    const cw = cv.width, ch = cv.height;
    ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = '#0d0f14';
    ctx.fillRect(0,0,cw,ch);

    const sc = Math.min(cw/W, ch/H);
    ctx.setTransform(sc,0,0,sc,(cw-W*sc)/2,(ch-H*sc)/2);

    const tm = t % LOOP;
    const {idx, r} = phaseInfo(tm);
    const ph = PH[idx];
    // colour crossfade at phase start
    const starts = [0,4,8,13];
    const into = tm - starts[idx];
    const prevC = PH[(idx+3)%4].c;
    const col = mixColor(prevC, ph.c, clamp(into/0.6,0,1));

    // stars
    ctx.fillStyle = '#8b92a8';
    for (const [x,y,z] of stars){
      ctx.globalAlpha = 0.35 + 0.25*Math.sin(t*0.6 + x);
      ctx.beginPath(); ctx.arc(x,y,z,0,Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ground
    const g = ctx.createLinearGradient(0,GROUND,0,H);
    g.addColorStop(0,'#171a24'); g.addColorStop(1,'#0d0f14');
    ctx.fillStyle = g; ctx.fillRect(0,GROUND,W,H-GROUND);
    ctx.strokeStyle = '#2a2f42'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0,GROUND); ctx.lineTo(W,GROUND); ctx.stroke();

    // figure position
    const fx = 450 + 280*Math.sin(t*0.35);
    const dir = Math.cos(t*0.35) >= 0 ? 1 : -1;
    const walk = t*5;
    figure(fx, dir, walk);

    // box position
    const bx = 450 + 280*Math.sin(t*0.35 - 0.7);
    const by = 120 + Math.sin(t*0.8)*8;

    const anchors = [
      [bx-45, by+30],
      [bx+45, by+30],
      [bx-23, by+14],
      [bx+67, by+14]
    ];
    const chest = [fx + dir*6, GROUND-102];

    for (let i = 3; i >= 0; i--){
      const [ax, ay] = anchors[i];
      let tx = ax + (i-1.5)*46 + Math.sin(t*0.9 + i*1.7)*30;
      let ty = ay + 170 + Math.sin(t*1.1 + i)*28;
      let wob = 1;
      if (i === 0){
        tx = lerp(tx, chest[0], r);
        ty = lerp(ty, chest[1], r);
        wob = 1 - r*0.75;
      }
      const tip = tentacle(ax, ay, tx, ty, i, t, wob, col);
      if (i === 0 && r > 0.02){
        // stuck marker: pulsing ring on the figure
        const pulse = 1 + 0.15*Math.sin(t*4);
        ctx.strokeStyle = col; ctx.lineWidth = 2;
        ctx.globalAlpha = r;
        ctx.beginPath(); ctx.arc(chest[0], chest[1], 9*pulse, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.arc(chest[0], chest[1], 15*pulse, 0, Math.PI*2); ctx.stroke();
        ctx.globalAlpha = 1;
      } else {
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(tip[0], tip[1], 3, 0, Math.PI*2); ctx.fill();
      }
    }

    box(bx, by, col);

    // UI
    chip.style.background = 'linear-gradient(90deg,' + ph.c + ' 50%,' + ph.c2 + ' 50%)';
    if (label.textContent !== ph.t) label.textContent = ph.t;
  }

  function frame(now){
    const dt = Math.min(0.05, (now - last)/1000);
    last = now;
    if (playing) t += dt;
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
