<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
  .rain line { animation: fall 1.2s linear infinite; }
  @keyframes fall { to { stroke-dashoffset: -104; } }
  .crack { stroke-dasharray: 1; stroke-dashoffset: 1; animation: grow 5s ease-in-out infinite; }
  @keyframes grow { 0% { stroke-dashoffset: 1; } 55%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  .pulse { animation: p 2.4s ease-in-out infinite; transform-origin: 160px 215px; }
  .pulse2 { animation: p 2.4s ease-in-out infinite reverse; transform-origin: 240px 215px; }
  @keyframes p { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.25); } }
</style>
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#1a1230"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9c2b0"/>
      <stop offset="0.5" stop-color="#ecd9c8"/>
      <stop offset="1" stop-color="#d9c2b0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="520" fill="url(#bg)"/>

  <!-- Regen / Neon (Re) -->
  <g class="rain" stroke="#3fd0c9" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="18 34">
    <line x1="30" y1="0" x2="20" y2="520"/><line x1="90" y1="0" x2="80" y2="520"/>
    <line x1="150" y1="0" x2="140" y2="520"/><line x1="250" y1="0" x2="240" y2="520"/>
    <line x1="310" y1="0" x2="300" y2="520"/><line x1="370" y1="0" x2="360" y2="520"/>
  </g>
  <rect x="0" y="0" width="14" height="520" fill="#ff2e88" fill-opacity="0.25"/>
  <rect x="386" y="0" width="14" height="520" fill="#2ea8ff" fill-opacity="0.25"/>

  <!-- Hals / Schultern -->
  <path d="M165 380 L165 430 Q100 450 60 520 L340 520 Q300 450 235 430 L235 380 Z" fill="#20202e"/>
  <rect x="165" y="360" width="70" height="80" fill="url(#skin)"/>

  <!-- Kopf: perfekt symmetrisch -->
  <path d="M200 70 C130 70 112 140 118 210 C122 290 155 375 200 385 C245 375 278 290 282 210 C288 140 270 70 200 70 Z" fill="url(#skin)"/>

  <!-- Haar -->
  <path d="M116 200 C104 110 140 52 200 52 C260 52 296 110 284 200 C280 150 262 108 200 100 C138 108 120 150 116 200 Z" fill="#1c1a22"/>

  
  <clipPath id="kopf"><path d="M200 70 C130 70 112 140 118 210 C122 290 155 375 200 385 C245 375 278 290 282 210 C288 140 270 70 200 70 Z"/></clipPath>
  <g clip-path="url(#kopf)" fill-opacity="0.22">
    <rect x="100" y="60" width="100" height="170" fill="#c0202a"/>
    <rect x="200" y="60" width="100" height="170" fill="#f4d03f"/>
    <rect x="100" y="230" width="100" height="170" fill="#ffffff"/>
    <rect x="200" y="230" width="100" height="170" fill="#2e9e4f"/>
  </g>

  <!-- Symmetrieachse (Ra) -->
  <line x1="200" y1="60" x2="200" y2="400" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="4 6"/>

  <!-- Augenbrauen -->
  <path d="M138 188 Q160 176 184 186" stroke="#2a2430" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M262 188 Q240 176 216 186" stroke="#2a2430" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Augen mit Nachglühen -->
  <ellipse cx="160" cy="215" rx="22" ry="11" fill="#f7f3ee"/>
  <ellipse cx="240" cy="215" rx="22" ry="11" fill="#f7f3ee"/>
  <circle class="pulse" cx="160" cy="215" r="20" fill="url(#glow)"/>
  <circle class="pulse2" cx="240" cy="215" r="20" fill="#2ea8ff" fill-opacity="0.45"/>
  <circle cx="160" cy="215" r="8" fill="#5a3a12"/>
  <circle cx="244" cy="216" r="8" fill="#1d6fb8"/>
  <circle cx="160" cy="215" r="3.5" fill="#000"/>
  <circle cx="244" cy="216" r="3.5" fill="#000"/>
  <circle cx="163" cy="212" r="1.6" fill="#fff"/>
  <circle cx="247" cy="213" r="1.6" fill="#fff"/>

  <!-- Nase -->
  <path d="M200 225 L192 285 Q200 295 208 285 Z" fill="#c9ae98" fill-opacity="0.55"/>
  <path d="M186 292 Q200 302 214 292" stroke="#b39680" stroke-width="2" fill="none"/>

  
  <!-- Ruz: Riss im Symmetriemuster -->
  <path class="crack" pathLength="1" d="M255 250 L246 272 L256 284 L244 310 L250 322" stroke="#ff2e88" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="crack" pathLength="1" d="M246 272 L232 276" stroke="#ff2e88" stroke-width="1.5" fill="none"/>

  
  <!-- Ruz-Vereinigung: Riss verzweigt sich -->
  <g stroke="#ff2e88" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="crack" pathLength="1" d="M250 322 L236 350 L222 372"/>
    <path class="crack" pathLength="1" d="M255 250 L268 228 L262 196 L272 160"/>
    <path class="crack" pathLength="1" d="M244 310 L226 306 L210 318"/>
    <path class="crack" pathLength="1" d="M200 100 L204 150 L196 200 L202 250 L194 300 L200 340"/>
    <path class="crack" pathLength="1" d="M196 200 L170 190 L150 196"/>
    <path class="crack" pathLength="1" d="M194 300 L172 296 L156 308"/>
  </g>

  <!-- Mund -->
  <path d="M170 332 Q200 342 232 326" stroke="#8c4f4f" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Wangenlinien -->
  <path d="M140 270 Q150 310 178 345" stroke="#c9ae98" stroke-opacity="0.5" stroke-width="2" fill="none"/>
  <path d="M260 270 Q250 310 222 345" stroke="#c9ae98" stroke-opacity="0.5" stroke-width="2" fill="none"/>

  <!-- Ro / Ra / Ri / Re Marker -->
  <g font-family="monospace" font-size="13" font-weight="bold">
    <rect x="20" y="20" width="16" height="16" fill="#c0202a"/><rect x="20" y="20" width="16" height="8" fill="#111"/>
    <text x="42" y="33" fill="#eee">Ro</text>
    <rect x="80" y="20" width="16" height="16" fill="#fff"/><rect x="80" y="20" width="16" height="8" fill="#111"/>
    <text x="102" y="33" fill="#eee">Ra</text>
    <rect x="140" y="20" width="16" height="16" fill="#fff"/><rect x="140" y="20" width="16" height="8" fill="#f4d03f"/>
    <text x="162" y="33" fill="#eee">Ri</text>
    <rect x="200" y="20" width="16" height="16" fill="#fff"/><rect x="200" y="20" width="16" height="8" fill="#2e9e4f"/>
    <text x="222" y="33" fill="#eee">Re</text>
  </g>

  <!-- Fahndungs-Beschriftung -->
  <rect x="90" y="470" width="220" height="30" fill="#000" fill-opacity="0.65"/>
  <text x="200" y="490" text-anchor="middle" font-family="monospace" font-size="13" fill="#ffb347">PHANTOMBILD · RO · BEWEGUNG</text>
</svg>
