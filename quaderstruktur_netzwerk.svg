<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="600" fill="#0f172a" />
  
  <!-- Grid Lines for Technical Aesthetic -->
  <g stroke="#334155" stroke-width="0.5" stroke-dasharray="4,4">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line y1="100" x1="0" y2="100" x2="800" />
    <line y1="200" x1="0" y2="200" x2="800" />
    <line y1="300" x1="0" y2="300" x2="800" />
    <line y1="400" x1="0" y2="400" x2="800" />
    <line y1="500" x1="0" y2="500" x2="800" />
  </g>

  <!-- Definitions for gradients and markers -->
  <defs>
    <linearGradient id="grad-ro" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="grad-ra" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="grad-ri" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="grad-re" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="cube-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- TENTACLES (Lines originating from the bottom-right cube base to 4 sectors) -->
  <!-- Top Left: Geografie (RO) -->
  <path d="M 620,440 C 400,350 250,200 180,120" fill="none" stroke="url(#grad-ro)" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <!-- Top Right: Medizin (RA) -->
  <path d="M 640,420 C 550,250 500,150 480,120" fill="none" stroke="url(#grad-ra)" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <!-- Center Left: Technologie (RI) -->
  <path d="M 600,450 C 400,450 250,380 150,320" fill="none" stroke="url(#grad-ri)" stroke-width="5" stroke-linecap="round" opacity="0.8" />
  <!-- Bottom Left: Popkultur (RE) -->
  <path d="M 610,470 C 450,550 300,520 150,480" fill="none" stroke="url(#grad-re)" stroke-width="5" stroke-linecap="round" opacity="0.8" />

  <!-- END KNOTS / LABELS -->
  <!-- Geografie -->
  <circle cx="180" cy="120" r="8" fill="#38bdf8" />
  <text x="180" y="95" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🌍 RO: Geografie</text>
  <text x="180" y="140" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Rumänien / Rosenheim</text>

  <!-- Medizin -->
  <circle cx="480" cy="120" r="8" fill="#f43f5e" />
  <text x="480" y="95" fill="#f43f5e" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🔬 RA: Medizin</text>
  <text x="480" y="140" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Rheumatoide Arthritis</text>

  <!-- Technologie -->
  <circle cx="150" cy="320" r="8" fill="#22c55e" />
  <text x="150" y="295" fill="#22c55e" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">💻 RI: Technologie</text>
  <text x="150" y="340" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">RFID / Resp. Investment</text>

  <!-- Popkultur -->
  <circle cx="150" cy="480" r="8" fill="#eab308" />
  <text x="150" y="455" fill="#eab308" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🎮 RE: Popkultur</text>
  <text x="150" y="500" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Resident Evil / Raiden</text>

  <!-- CENTRAL CUBE STRUCTURE (Bottom Right) -->
  <!-- Isometric Cube Projection -->
  <g transform="translate(620, 450)">
    <!-- Top Face -->
    <polygon points="0,-40 50,-15 0,10 -50,-15" fill="#64748b" stroke="#475569" stroke-width="2" />
    <!-- Left Face -->
    <polygon points="-50,-15 0,10 0,60 -50,35" fill="#334155" stroke="#1e293b" stroke-width="2" />
    <!-- Right Face -->
    <polygon points="0,10 50,-15 50,35 0,60" fill="#1e293b" stroke="#0f172a" stroke-width="2" />
    
    <!-- Central Glow/Core Indicator -->
    <circle cx="0" cy="10" r="5" fill="#38bdf8" opacity="0.7" />
    
    <!-- Base Label -->
    <text x="0" y="85" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Re_quaderstruktur</text>
    <text x="0" y="100" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Basis (Unten Rechts)</text>
  </g>
</svg>
