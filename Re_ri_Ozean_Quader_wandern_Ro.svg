<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" width="600" height="620" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
 text { font-family: monospace; }
 .wave1 { animation: sw 5s ease-in-out infinite alternate; }
 .wave2 { animation: sw 7s ease-in-out infinite alternate-reverse; }
 @keyframes sw { from { transform: translateX(-18px); } to { transform: translateX(18px); } }
 .orbit { transform-origin: 300px 300px; animation: rot 16s linear infinite; }
 .un { animation: rot 16s linear infinite reverse; }
 @keyframes rot { to { transform: rotate(360deg); } }
 .quad { animation: bob 4s ease-in-out infinite alternate; }
 @keyframes bob { from { transform: translateY(-5px); } to { transform: translateY(5px); } }
 .tent { animation: wig 2.6s ease-in-out infinite alternate; }
 @keyframes wig { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
 .bub { opacity: 0; animation: rise 9s ease-in infinite; }
 @keyframes rise { 0% { opacity: 0; transform: translate(0,0) scale(.5); } 12% { opacity: .9; }
   80% { opacity: .75; } 100% { opacity: 0; transform: translate(var(--dx),-110px) scale(1.1); } }
 .ri { stroke: #f4d03f; stroke-width: 2; stroke-dasharray: 8 8; stroke-opacity: .85; animation: flow 1.6s linear infinite; }
 .ri.diag { stroke: #ffffff; stroke-opacity: .55; stroke-dasharray: 3 9; animation-duration: 2.4s; }
 @keyframes flow { to { stroke-dashoffset: -32; } }
 .puls { transform-origin: 300px 300px; animation: pu 3s ease-in-out infinite; }
 @keyframes pu { 0%,100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.25); opacity: 1; } }
 .kl { animation: pl 3s ease-in-out infinite alternate; }
 @keyframes pl { from { opacity: .4; } to { opacity: 1; } }
 .bt { font-size: 10px; fill: #fff; text-anchor: middle; }
</style>
