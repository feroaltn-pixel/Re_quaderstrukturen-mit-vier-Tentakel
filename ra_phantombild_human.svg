<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="800" fill="#0b0b0b"/>
  <text x="400" y="48" fill="#ffffff" font-family="monospace" font-size="20" text-anchor="middle">Ra("Phantombild_of_replicant")</text>

  <!-- vier Steine (Kreise) in den Ecken, je ein Strich: Ro Ra Ri Re -->
  <g stroke-width="3" fill="none">
    <circle cx="150" cy="170" r="48" stroke="#d62828"/>
    <circle cx="650" cy="170" r="48" stroke="#ffffff"/>
    <circle cx="150" cy="640" r="48" stroke="#f4d03f"/>
    <circle cx="650" cy="640" r="48" stroke="#2ecc71"/>
  </g>
  <g stroke-width="6" stroke-linecap="round">
    <line x1="150" y1="90" x2="150" y2="250" stroke="#d62828"/>
    <line x1="650" y1="90" x2="650" y2="250" stroke="#ffffff"/>
    <line x1="150" y1="560" x2="150" y2="720" stroke="#f4d03f"/>
    <line x1="650" y1="560" x2="650" y2="720" stroke="#2ecc71"/>
  </g>
  <g font-family="monospace" font-size="16" text-anchor="middle">
    <text x="150" y="285" fill="#d62828">Ro</text>
    <text x="650" y="285" fill="#ffffff">Ra</text>
    <text x="150" y="755" fill="#f4d03f">Ri</text>
    <text x="650" y="755" fill="#2ecc71">Re</text>
  </g>

  <!-- vier Tentakel von den Quaderecken zu den Steinen -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M335 330 C260 280 230 230 190 195" stroke="#d62828"/>
    <path d="M465 330 C540 280 570 230 610 195" stroke="#ffffff"/>
    <path d="M335 470 C260 520 230 580 190 615" stroke="#f4d03f"/>
    <path d="M465 470 C540 520 570 580 610 615" stroke="#2ecc71"/>
  </g>

  <!-- Quader (schwarz-weiss = Ra) -->
  <g stroke="#ffffff" stroke-width="3" stroke-linejoin="round">
    <polygon points="335,330 465,330 465,470 335,470" fill="#161616"/>
    <polygon points="335,330 375,300 505,300 465,330" fill="#2a2a2a"/>
    <polygon points="465,330 505,300 505,440 465,470" fill="#1d1d1d"/>
  </g>

  <!-- Phantombild: abstrakter Kopf im Quader -->
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <ellipse cx="400" cy="400" rx="38" ry="52"/>
    <line x1="382" y1="392" x2="394" y2="392"/>
    <line x1="406" y1="392" x2="418" y2="392"/>
    <line x1="400" y1="395" x2="400" y2="412"/>
    <line x1="388" y1="425" x2="412" y2="425"/>
  </g>

  <!-- Ruz-Funke an der Kreuzung -->
  <circle cx="400" cy="400" r="70" fill="none" stroke="#f4d03f" stroke-width="1.5" stroke-dasharray="4 6"/>
</svg>
