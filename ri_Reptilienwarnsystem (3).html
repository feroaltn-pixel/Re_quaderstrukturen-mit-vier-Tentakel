<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ri_Reptilienwarnsystem</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;background:#0b0f1a;color:#e8ecf4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
#ui{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;pointer-events:none}
#ui span,#ui button{pointer-events:auto;background:rgba(20,26,44,.85);border:1px solid #2b3556;border-radius:8px;padding:6px 10px;color:inherit;font:inherit}
#ui button{cursor:pointer}
h1{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;margin:0;font-size:16px;font-weight:600;letter-spacing:.02em}
</style>
</head>
<body>
<h1>ri_Reptilienwarnsystem</h1>
<div id="ui">
<span style="color:#ff6b6b">Ro</span><span style="color:#ffb454">Ra</span><span style="color:#5aa0ff">Ri</span><span style="color:#4fd18b">Re</span>
<button id="pause">Pause</button>
<span>Ziehen: drehen · Zoom: Mausrad/Pinch</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const C={Ro:0xff6b6b,Ra:0xffb454,Ri:0x5aa0ff,Re:0x4fd18b};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0f1a);
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,.1,100);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.body.appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0xffffff,.6));
const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(5,10,6);scene.add(dl);

function label(t,col,s=.6){const c=document.createElement('canvas');c.width=256;c.height=96;const x=c.getContext('2d');x.font='bold 54px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#'+new THREE.Color(col).getHexString();x.fillText(t,128,48);
const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));sp.scale.set(s*2.67,s,1);return sp}

const H=4,R=4;
// Raum
const room=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2*R,H,2*R)),new THREE.LineBasicMaterial({color:0x3a4670}));room.position.y=H/2;scene.add(room);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(2*R,2*R),new THREE.MeshStandardMaterial({color:0x141a2e}));floor.rotation.x=-Math.PI/2;scene.add(floor);
scene.add(new THREE.GridHelper(2*R,16,0x2b3556,0x1d2540));

// Ecken: zwei Halbzylinder, zwei eckig
function halfCyl(x,z,rot){const m=new THREE.Mesh(new THREE.CylinderGeometry(.9,.9,H,24,1,false,0,Math.PI),new THREE.MeshStandardMaterial({color:0x5aa0ff,transparent:true,opacity:.35,side:THREE.DoubleSide}));m.position.set(x,H/2,z);m.rotation.y=rot;scene.add(m)}
function boxCorner(x,z){const m=new THREE.Mesh(new THREE.BoxGeometry(.9,H,.9),new THREE.MeshStandardMaterial({color:0x8892b0,transparent:true,opacity:.3}));m.position.set(x,H/2,z);scene.add(m)}
halfCyl(-R+.45,-R+.45,Math.PI*.75);halfCyl(R-.45,R-.45,-Math.PI*.25);
boxCorner(R-.45,-R+.45);boxCorner(-R+.45,R-.45);
const src=label('Ri Quelle',C.Ri,.5);src.position.set(-R+.6,H+.3,-R+.6);scene.add(src);
const snk=label('Ri Senke',C.Ri,.5);snk.position.set(R-.6,H+.3,R-.6);scene.add(snk);

// Person
const body=new THREE.MeshStandardMaterial({color:0xc9d3ea});
const person=new THREE.Group();
const torso=new THREE.Mesh(new THREE.CylinderGeometry(.22,.2,.7,16),body);torso.position.y=1.25;person.add(torso);
[-.1,.1].forEach(x=>{const l=new THREE.Mesh(new THREE.CylinderGeometry(.08,.07,.9,12),body);l.position.set(x,.45,0);person.add(l);const a=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.7,10),body);a.position.set(x*3,1.2,0);person.add(a)});
const head=new THREE.Mesh(new THREE.SphereGeometry(.17,20,16),body);head.position.y=1.75;person.add(head);
// Wirbelsäule C / T / L (Rückseite)
const sp=[['C',7,0xff6b6b,1.68,1.5],['T',12,0xffb454,1.5,1.0],['L',5,0x4fd18b,1.0,.75]];
sp.forEach(([n,k,col,y0,y1])=>{for(let i=0;i<k;i++){const v=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),new THREE.MeshBasicMaterial({color:col}));v.position.set(0,y0+(y1-y0)*i/(k-1),-.22);person.add(v)}
const t=label(n+'1–'+n+'n',col,.18);t.position.set(.45,(y0+y1)/2,-.22);person.add(t)});
scene.add(person);

// Fünf Ro/Ra/Ri/Re-Ebenen über dem Kopf
const keys=['Ro','Ra','Ri','Re'],pc=[[-1.6,-1.6],[1.6,-1.6],[1.6,1.6],[-1.6,1.6]];
const planes=[];
for(let p=0;p<5;p++){const y=2.2+p*.38;
 const g=new THREE.Mesh(new THREE.PlaneGeometry(3.2,3.2),new THREE.MeshBasicMaterial({color:0x5aa0ff,transparent:true,opacity:p==0?.16:.07,side:THREE.DoubleSide}));g.rotation.x=-Math.PI/2;g.position.y=y;scene.add(g);planes.push(g);
 const e=new THREE.LineSegments(new THREE.EdgesGeometry(g.geometry),new THREE.LineBasicMaterial({color:0x5aa0ff}));e.rotation.x=-Math.PI/2;e.position.y=y;scene.add(e);
 keys.forEach((k,i)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.07,12,12),new THREE.MeshBasicMaterial({color:C[k]}));m.position.set(pc[i][0],y,pc[i][1]);scene.add(m);
  if(p==0||p==4){const t=label(k,C[k],.3);t.position.set(pc[i][0]*1.12,y+.2,pc[i][1]*1.12);scene.add(t)}})}

// Quaderstruktur mit vier Tentakeln (auf unterster Ebene)
const q=new THREE.Mesh(new THREE.BoxGeometry(.5,.3,.5),new THREE.MeshStandardMaterial({color:0x4fd18b}));q.position.set(0,2.35,0);scene.add(q);
const tents=[];
pc.forEach((c,i)=>{const k=keys[i];const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,2.35,0),new THREE.Vector3(c[0]*.4,2.6,c[1]*.4),new THREE.Vector3(c[0]*.8,2.1,c[1]*.8),new THREE.Vector3(c[0],2.2,c[1])]);
 scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve,40,.025,6,false),new THREE.MeshBasicMaterial({color:C[k]})));tents.push(curve)});

// Welle Quelle -> Senke
const A=new THREE.Vector3(-R+.45,1.4,-R+.45),B=new THREE.Vector3(R-.45,1.4,R-.45);
scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([A,B]),new THREE.LineBasicMaterial({color:0x5aa0ff,transparent:true,opacity:.35})));
const rings=[];for(let i=0;i<4;i++){const r=new THREE.Mesh(new THREE.RingGeometry(.98,1,48),new THREE.MeshBasicMaterial({color:0x5aa0ff,transparent:true,side:THREE.DoubleSide}));r.rotation.x=-Math.PI/2;r.position.set(A.x,.02,A.z);scene.add(r);rings.push(r)}
const pulses=[];for(let i=0;i<6;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.09,12,12),new THREE.MeshBasicMaterial({color:0x5aa0ff}));scene.add(m);pulses.push(m)}
const sinkRing=new THREE.Mesh(new THREE.RingGeometry(.5,.55,40),new THREE.MeshBasicMaterial({color:0x5aa0ff,transparent:true,side:THREE.DoubleSide}));sinkRing.rotation.x=-Math.PI/2;sinkRing.position.set(B.x,.03,B.z);scene.add(sinkRing);

// 20 Schnittmengen: an jeder der 4 Ri-Ecken 5 (Ro rot/schwarz, Ra, Ri, Re, Ro lila/schwarz)
const SM=[['Ro',0xe02020,0x050505],['Ra',0xffb454,0x050505],['Ri',0x5aa0ff,0x050505],['Re',0x4fd18b,0x050505],['Ro',0x9b3dff,0x050505]];
const cornerPos=[[-1,-1],[1,-1],[1,1],[-1,1]],sr=.34,sd=.42,hr=sr-sd/2,pr=Math.sqrt(sr*sr-sd*sd/4);
const smGroups=[];
cornerPos.forEach(([cx,cz])=>{const px=cx*(R-1.3),pz=cz*(R-1.3);
 SM.forEach(([k,c1,c2],i)=>{const g=new THREE.Group();g.position.set(px,.55+i*.7,pz);
  const mk=(col,x,op)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(sr,24,18),new THREE.MeshStandardMaterial({color:col,transparent:true,opacity:op,emissive:col,emissiveIntensity:col==0x050505?0:.25,depthWrite:false}));m.position.x=x;g.add(m);const w=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,40),new THREE.LineBasicMaterial({color:col==0x050505?0x6b7488:col}));w.position.x=x;g.add(w)};
  mk(c1,-sd/2,.35);mk(c2,sd/2,.55);
  const lens=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),new THREE.MeshBasicMaterial({color:new THREE.Color(c1).lerp(new THREE.Color(0xffffff),.35)}));lens.scale.set(hr,pr,pr);g.add(lens);
  const t=label(k,c1,.2);t.position.set(0,sr+.18,0);g.add(t);
  scene.add(g);smGroups.push(g)})});
// Kamera per Ziehen
let az=.9,el=.45,dist=13,paused=false,drag=null;
const cv=ren.domElement;
cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;az-=(e.clientX-drag[0])*.005;el=Math.max(.05,Math.min(1.4,el+(e.clientY-drag[1])*.005));drag=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(5,Math.min(22,dist+e.deltaY*.01))},{passive:false});
let pd=0;cv.addEventListener('touchmove',e=>{if(e.touches.length==2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pd)dist=Math.max(5,Math.min(22,dist-(d-pd)*.03));pd=d}},{passive:true});
cv.addEventListener('touchend',()=>pd=0);
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Weiter':'Pause'};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

let t=0;
function loop(){requestAnimationFrame(loop);if(!paused)t+=.008;
 rings.forEach((r,i)=>{const p=(t*.6+i/4)%1;const s=.3+p*9;r.scale.set(s,s,s);r.material.opacity=.6*(1-p)});
 pulses.forEach((m,i)=>{const p=(t*.5+i/6)%1;m.position.lerpVectors(A,B,p);m.position.y+=Math.sin(p*Math.PI*8)*.08;m.scale.setScalar(.6+.6*Math.sin(p*Math.PI))});
 const sp2=(Math.sin(t*4)+1)/2;sinkRing.scale.setScalar(1+sp2*.5);sinkRing.material.opacity=.3+.5*sp2;
 q.rotation.y=t*.5;smGroups.forEach((g,i)=>g.rotation.y=t*.6+i*.3);head.position.y=1.75+Math.sin(t*2)*.005;
 cam.position.set(Math.sin(az)*Math.cos(el)*dist,Math.sin(el)*dist+1.5,Math.cos(az)*Math.cos(el)*dist);cam.lookAt(0,1.8,0);
 ren.render(scene,cam)}
loop();
</script>
</body>
</html>
